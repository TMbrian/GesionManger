[versions]
# Android & Kotlin
agp = "8.10.1"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.28"

# AndroidX Core
coreKtx = "1.13.0"
appcompat = "1.7.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
lifecycle = "2.9.0"

# Compose
compose = "2025.05.01"
activityCompose = "1.10.1"
material3Android = "1.3.2"
navigationCompose = "2.9.0"

# Material Design
material = "1.12.0"

# Dependency Injection
hilt = "2.52"
hiltNavigationCompose = "1.2.0"

# Async & Coroutines
coroutines = "1.7.3"

# Network
retrofit = "2.9.0"
okhttp = "4.12.0"

# Database
room = "2.7.1"

# Image Loading
coilCompose = "2.5.0"

# Google Services
playServicesAuth = "21.3.0"

# Testing
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"

# Code Generation (para resolver conflictos)
javapoet = "1.13.0"

[libraries]
# ================================
# ANDROIDX CORE
# ================================
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# ================================
# LIFECYCLE
# ================================
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# ================================
# MATERIAL DESIGN
# ================================
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# ================================
# COMPOSE
# ================================
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Android" }

# ================================
# NAVIGATION
# ================================
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ================================
# DEPENDENCY INJECTION (HILT)
# ================================
google-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
google-hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# ================================
# COROUTINES
# ================================
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# ================================
# NETWORK
# ================================
squareup-retrofit2 = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
squareup-retrofit2-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
squareup-okhttp3 = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
squareup-okhttp3-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# ================================
# DATABASE (ROOM)
# ================================
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ================================
# IMAGE LOADING
# ================================
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }

# ================================
# GOOGLE SERVICES
# ================================
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# ================================
# TESTING
# ================================
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# ================================
# CODE GENERATION (Conflictos)
# ================================
squareup-javapoet = { group = "com.squareup", name = "javapoet", version.ref = "javapoet" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }